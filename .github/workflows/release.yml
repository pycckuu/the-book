name: Rebuild release downloads (PDF + EPUB)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to rebuild or backfill
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Check out current release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools

      - name: Set up Quarto (with TinyTeX for PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Russian typography prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-paratype
          tex_bin="$(dirname "$(find "$HOME/.TinyTeX/bin" -name tlmgr -print -quit)")"
          test -x "$tex_bin/tlmgr"
          export PATH="$tex_bin:$PATH"
          echo "$tex_bin" >> "$GITHUB_PATH"
          tlmgr install hyphen-russian
          kpsewhich hyph-ru.tex

      - name: Render (PDF + EPUB)
        run: |
          rm -rf dist
          mkdir -p dist

          quarto render --to pdf
          cp _book/*.pdf dist/

          quarto render --to epub
          cp _book/*.epub dist/

      - name: Build Russian book and separate bilingual course downloads
        run: python3 .release-tools/scripts/build-release-translations.py --repo . --output dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.pdf
            dist/*.epub
            dist/translation-assets.json
