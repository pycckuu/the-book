name: Rebuild release downloads (PDF + EPUB)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to rebuild or backfill
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Set up Quarto (with TinyTeX for PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render (PDF + EPUB)
        run: |
          rm -rf dist
          mkdir -p dist

          quarto render --to pdf
          cp _book/*.pdf dist/

          quarto render --to epub
          cp _book/*.epub dist/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.pdf
            dist/*.epub
