project:
  type: book
  output-dir: _book
  resources:
    - sources/img
    - "!courses/oxygen-diffusion/**"
    - "!courses/advection-dispersion/**"
    - courses/saturation-kinetics/model
    - courses/saturation-kinetics/en/worksheets
    - courses/saturation-kinetics/ru/worksheets
    - courses/saturation-kinetics/en/exercise-outcome-map.json
    - courses/energy-constraints/model
    - courses/energy-constraints/en/worksheets
    - courses/energy-constraints/en/data
    - courses/energy-constraints/en/exercise-outcome-map.json

book:
  title: "The Invisible Architects"
  subtitle: "How Microbes Built the World"
  author: "Igor Markelov"
  date: "February 1, 2026"
  version: "0.69"
  search: true
  output-file: the-invisible-architects
  downloads: [pdf, epub]
  chapters:
    - index.md
    - part: "Part I: The Rules of the Game"
      chapters:
        - chapters/01-budget-of-the-universe.md
        - chapters/02-the-stage.md
    - part: "Part II: The First Society"
      chapters:
        - chapters/03-spark.md
        - chapters/04-the-first-city.md
        - chapters/05-the-poisoning.md
    - part: "Part III: The Great Mergers"
      chapters:
        - chapters/06-cannibals-and-voters.md
        - chapters/07-the-merger.md
    - part: "Part IV: The Hidden World and the Future"
      chapters:
        - chapters/08-the-equation.md
        - chapters/09-cities-without-sunlight.md
        - chapters/10-the-water-planet.md
        - chapters/epilogue.md
  appendices:
    - appendices/a-energy-toolkit.md
    - appendices/b-model-toolkit.md
    - appendices/c-reaction-gallery.md
    - appendices/d-math-without-pain.md
    - appendices/e-dramatis-personae.md
    - courses/oxygen-diffusion/en/student-packet-en.md
    - courses/oxygen-diffusion/en/instructor-packet-en.md
    - courses/oxygen-diffusion/optional-observed-data/data-comparison-task.md
    - courses/oxygen-diffusion/optional-observed-data/data-comparison-solutions.md
    - courses/saturation-kinetics/en/scientific-reading.md
    - courses/saturation-kinetics/en/student-packet.md
    - courses/saturation-kinetics/en/OPEN-worked-answers.md
    - courses/energy-constraints/en/scientific-reading.md
    - courses/energy-constraints/en/student-packet.md
    - courses/energy-constraints/en/OPEN-worked-answers.md
    - courses/advection-dispersion/en/student-packet-en.qmd
    - courses/advection-dispersion/en/worked-answers-en.qmd

filters:
  - filters/companion-links.lua
  - filters/delayed-footnotes.lua

bibliography: sources/bibliograph.bib
suppress-bibliography: true

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
  pdf:
    documentclass: scrbook
    pdf-engine: xelatex
    toc: true
    number-sections: true
  epub:
    toc: true
    number-sections: true
